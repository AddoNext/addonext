services:
    proxy:
        image: traefik:latest
        ports:
            - 127.0.0.1:80:80
        networks:
            - elementrify
        command: --providers.docker
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
    wordpress:
        build:
            context: ./configs
            dockerfile: Dockerfile
        restart: always
        volumes:
            - wordpress:/var/www/html
            - ./wordpress:/var/www/html
            - ./:/var/www/html/wp-content/plugins/elementrify
            - ./configs/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
            - ./configs/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
        labels:
            traefik.http.routers.wordpress.rule: Host(`elementrify.localhost`)
            traefik.http.services.wordpress.loadbalancer.server.port: 80
        environment:
            - WORDPRESS_DB_HOST=mysql
            - WORDPRESS_DB_USER=wordpress
            - WORDPRESS_DB_PASSWORD=password
            - WORDPRESS_DB_NAME=wordpress
            - WORDPRESS_DEBUG=true
        depends_on:
            mysql:
                condition: service_healthy
            composer:
                condition: service_completed_successfully
            npm:
                condition: service_started
        networks:
            - elementrify
    composer:
        image: composer
        volumes:
            - ./:/var/www/html:rw
        working_dir: /var/www/html
        command: sh -c "rm -f composer.lock && composer install"
        networks:
            - elementrify
        labels:
            traefik.enable: "false"
    npm:
        image: node:22.14.0-alpine
        volumes:
            - ./:/app
        working_dir: /app
        command: sh -c "npm install && chmod +x node_modules/.bin/* && npm run build && npm run start"
        networks:
            - elementrify
        labels:
            traefik.enable: "false"
    mysql:
        image: mysql:8.0
        restart: always
        volumes:
            - db:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_DATABASE=wordpress
            - MYSQL_USER=wordpress
            - MYSQL_PASSWORD=password
            - MYSQL_RANDOM_ROOT_PASSWORD=yes
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - elementrify
    phpmyadmin:
        image: phpmyadmin
        environment:
            - PMA_HOST=mysql
            - PMA_USER=wordpress
            - PMA_PASSWORD=password
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - elementrify
        labels:
            traefik.http.routers.phpmyadmin.rule: Host(`phpmyadmin.localhost`)
            traefik.http.services.phpmyadmin.loadbalancer.server.port: 80
    adminer:
        image: adminer
        environment:
            - ADMINER_DEFAULT_SERVER=mysql
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - elementrify
        labels:
            traefik.http.routers.adminer.rule: Host(`adminer.localhost`)
            traefik.http.services.adminer.loadbalancer.server.port: 80
volumes:
    wordpress:
    db:
networks:
    elementrify:
        driver: bridge
